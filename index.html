<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瞑想アプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* 峰不二子をイメージさせるダークでセクシー、かつスタイリッシュな背景カラーとグラデーション */
      background: linear-gradient(135deg, #1a1a1a 0%, #3a0007 50%, #111111 100%);
      color: #f7fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      /* お写真のような落ち着いた上品なカードデザイン */
      background: #fdfbf7;
      color: #2d3748;
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      text-align: center;
    }
    .date-bar {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 8px;
    }
    .app-subtitle {
      font-size: 0.85rem;
      color: #e53e3e;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }
    h1 { font-size: 1.6rem; color: #1a202c; margin-bottom: 15px; }
    
    .course-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-course {
      flex: 1;
      padding: 10px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: #fff;
      color: #4a5568;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-course.active {
      background: #e53e3e;
      color: #fff;
      border-color: #e53e3e;
    }

    /* 現在のステップ表示エリア */
    .current-step-box {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .step-label {
      font-size: 0.9rem;
      color: #e53e3e;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .timer-display {
      font-size: 3rem;
      font-weight: bold;
      color: #1a202c;
      margin: 5px 0 10px;
      font-variant-numeric: tabular-nums;
    }

    .control-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    .btn-action {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-start { background: #d69e2e; color: #fff; }
    .btn-reset { background: #e53e3e; color: #fff; }

    /* お写真のようなリスト表示部分 */
    .steps-list {
      text-align: left;
      border-top: 1px solid #e2e8f0;
      padding-top: 15px;
    }
    .steps-list-title {
      font-size: 0.85rem;
      color: #a0aec0;
      margin-bottom: 10px;
      text-align: center;
    }
    .step-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #edf2f7;
      font-size: 0.95rem;
    }
    .step-item.active-row {
      background: #fff5f5;
      font-weight: bold;
      color: #e53e3e;
      border-radius: 8px;
      padding-left: 8px;
      padding-right: 8px;
    }
    .step-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .step-badge {
      background: #ed8936;
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="date-bar" id="currentDate"></div>
  <div class="app-subtitle">峰不二子 Style Meditation</div>

  <h1>瞑想アプリ</h1>

  <div class="course-selector">
    <button class="btn-course active" onclick="selectCourse(9)">9分コース</button>
    <button class="btn-course" onclick="selectCourse(21)">21分コース</button>
  </div>

  <div class="current-step-box">
    <div class="step-label" id="stepName">第6チャクラ</div>
    <div class="timer-display" id="timeDisplay">01:00</div>
  </div>

  <div class="control-btns">
    <button class="btn-action btn-start" id="startBtn" onclick="toggleTimer()">スタート</button>
    <button class="btn-action btn-reset" onclick="resetTimer()">リセット</button>
  </div>

  <div class="steps-list">
    <div class="steps-list-title">コース構成</div>
    <div id="stepsListContainer"></div>
  </div>
</div>

<script>
  // 低音シンキングボウル風ゴング音生成
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSingingBowl() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(146.83, audioCtx.currentTime); // D3
    
    gain.gain.setValueAtTime(0.0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 4.5);
  }

  function playSingleGong() {
    playSingingBowl();
  }

  function playTripleGong() {
    playSingingBowl();
    setTimeout(playSingingBowl, 1500);
    setTimeout(playSingingBowl, 3000);
  }

  // ご指定の正確な構成
  const courses = {
    9: [
      { name: "第6チャクラ", duration: 60, minText: "1分" },
      { name: "第7チャクラ", duration: 60, minText: "1分" },
      { name: "第1チャクラ", duration: 180, minText: "3分" },
      { name: "ステージ",     duration: 180, minText: "3分" },
      { name: "軟酥",         duration: 60, minText: "1分" }
    ],
    21: [
      { name: "第6チャクラ", duration: 180, minText: "3分" },
      { name: "第7チャクラ", duration: 180, minText: "3分" },
      { name: "第1チャクラ", duration: 360, minText: "6分" },
      { name: "ステージ",     duration: 360, minText: "6分" },
      { name: "軟酥",         duration: 180, minText: "3分" }
    ]
  };

  let currentCourseMinutes = 9;
  let currentStepIdx = 0;
  let stepSecondsLeft = 0;
  let timerId = null;
  let isRunning = false;

  function init() {
    const now = new Date();
    document.getElementById('currentDate').innerText = now.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
    selectCourse(9);
  }

  function selectCourse(mins) {
    if (isRunning) resetTimer();
    currentCourseMinutes = mins;
    document.querySelectorAll('.btn-course').forEach(btn => {
      btn.classList.toggle('active', btn.innerText.includes(mins + '分'));
    });
    currentStepIdx = 0;
    loadStep(0);
    renderStepsList();
  }

  function renderStepsList() {
    const container = document.getElementById('stepsListContainer');
    const steps = courses[currentCourseMinutes];
    container.innerHTML = '';
    
    steps.forEach((step, idx) => {
      const row = document.createElement('div');
      row.className = 'step-item' + (idx === currentStepIdx ? ' active-row' : '');
      row.innerHTML = `
        <div class="step-left">
          <div class="step-badge">${idx + 1}</div>
          <span>${step.name}</span>
        </div>
        <span>${step.minText}</span>
      `;
      container.appendChild(row);
    });
  }

  function loadStep(idx) {
    const steps = courses[currentCourseMinutes];
    if (idx >= steps.length) return;
    currentStepIdx = idx;
    stepSecondsLeft = steps[idx].duration;
    document.getElementById('stepName').innerText = steps[idx].name;
    updateDisplay();
    renderStepsList();
  }

  function updateDisplay() {
    const m = Math.floor(stepSecondsLeft / 60).toString().padStart(2, '0');
    const s = (stepSecondsLeft % 60).toString().padStart(2, '0');
    document.getElementById('timeDisplay').innerText = `${m}:${s}`;
  }

  function toggleTimer() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    if (isRunning) {
      clearInterval(timerId);
      isRunning = false;
      document.getElementById('startBtn').innerText = 'スタート';
    } else {
      isRunning = true;
      document.getElementById('startBtn').innerText = '一時停止';
      timerId = setInterval(tick, 1000);
    }
  }

  function tick() {
    if (stepSecondsLeft > 0) {
      stepSecondsLeft--;
      updateDisplay();
    } else {
      const steps = courses[currentCourseMinutes];
      if (currentStepIdx < steps.length - 1) {
        playSingleGong();
        loadStep(currentStepIdx + 1);
      } else {
        clearInterval(timerId);
        isRunning = false;
        playTripleGong();
        document.getElementById('startBtn').innerText = 'スタート';
        alert('すべての瞑想が完了しました');
      }
    }
  }

  function resetTimer() {
    clearInterval(timerId);
    isRunning = false;
    document.getElementById('startBtn').innerText = 'スタート';
    loadStep(0);
  }

  window.onload = init;
</script>
</body>
</html>
