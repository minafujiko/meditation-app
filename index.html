<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瞑想の記録</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #121212 0%, #2b0b0e 50%, #1a1a1a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #f4efe6;
      color: #2d3748;
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
      border: 1px solid rgba(214, 158, 46, 0.3);
      position: relative;
    }
    .record-title {
      font-size: 0.95rem;
      color: #718096;
      letter-spacing: 1px;
      margin-bottom: 4px;
      border-bottom: 1px solid #e2dcd0;
      padding-bottom: 10px;
    }
    
    /* 大きな日付表示 */
    .date-info {
      font-size: 1.5rem !important;
      color: #1a202c !important;
      margin: 8px 0 4px 0;
      font-weight: 800 !important;
    }

    /* 時間のログ表示（赤色・太字） */
    .session-time-log {
      font-size: 1.3rem;
      color: #e53e3e;
      font-weight: 900;
      margin-top: 4px;
      min-height: 1.5em;
      letter-spacing: 0.5px;
    }

    .timer-container {
      position: relative;
      display: inline-block;
      width: 100%;
      margin: 10px 0 20px 0;
    }

    .fujiko-img {
      position: absolute;
      top: 35px;
      right: -15px;
      width: 70px;
      height: auto;
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    .total-time {
      font-size: 3.2rem;
      font-weight: bold;
      color: #1a202c;
      margin: 0;
      letter-spacing: -1px;
    }
    .completed-display {
      font-size: 2.6rem;
      font-weight: 900;
      color: #dd6b20;
    }

    .course-title-sub {
      font-size: 1.05rem;
      color: #2d3748;
      font-weight: bold;
      margin-bottom: 6px;
    }
    
    /* 本日の合計表示（大きく目立たせる） */
    .today-sum {
      font-size: 1.25rem;
      color: #9c4221;
      font-weight: 900;
      margin-bottom: 20px;
      min-height: 1.4em;
      letter-spacing: 0.5px;
    }

    .course-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .btn-course {
      flex: 1;
      padding: 10px;
      border: 2px solid #d4c5b9;
      border-radius: 12px;
      background: #fff;
      color: #4a5568;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-course.active {
      background: #dd6b20;
      color: #fff;
      border-color: #dd6b20;
    }

    /* 小さくスリムな操作ボタン */
    .control-btns {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .btn-action {
      padding: 8px 24px !important;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.9rem !important;
      cursor: pointer;
      flex: 0 1 auto !important;
      min-width: 110px;
    }
    .btn-start { background: #d69e2e; color: #fff; }
    .btn-reset { background: #e53e3e; color: #fff; }

    .steps-list {
      text-align: left;
      border-top: 1px solid #e2dcd0;
      padding-top: 16px;
    }
    .step-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 8px;
      border-bottom: 1px solid #eae5dc;
      font-size: 1rem;
      color: #2d3748;
    }
    .step-item.active-row {
      background: #eae3d5;
      border-radius: 10px;
      font-weight: bold;
      color: #9c4221;
    }
    .step-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .step-badge {
      background: #dd6b20;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .step-time-text {
      font-weight: bold;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="record-title">瞑想の記録</div>
  <div class="date-info" id="currentDate"></div>
  <div class="session-time-log" id="timeLog"></div>

  <div class="timer-container">
    <div class="total-time" id="timeDisplay">01:00</div>
    <img src="不二子.png" class="fujiko-img" alt="峰不二子">
  </div>

  <div class="course-title-sub" id="stepName">第6チャクラ</div>
  <div class="today-sum" id="todaySumDisplay">本日の合計：0分</div>

  <div class="course-selector">
    <button class="btn-course active" onclick="selectCourse(9)">9分コース</button>
    <button class="btn-course" onclick="selectCourse(21)">21分コース</button>
  </div>

  <div class="control-btns">
    <button class="btn-action btn-start" id="startBtn" onclick="toggleTimer()">スタート</button>
    <button class="btn-action btn-reset" onclick="resetTimer()">リセット</button>
  </div>

  <div class="steps-list" id="stepsListContainer"></div>
</div>

<script>
  let audioCtx = null;

  // 毎回確実にオーディオコンテキストを起こして鳴らせるようにする
  function getAudioContext() {
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    } catch(e) {
      console.log('Audio init error:', e);
    }
    return audioCtx;
  }

  // ゴング音（大きく、深く響くシンギングボウル音）
  function playGongSound() {
    const ctx = getAudioContext();
    if (!ctx) return;

    try {
      if (ctx.state === 'suspended') {
        ctx.resume();
      }

      const now = ctx.currentTime;

      // 主音（豊かで太い響き）
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = 'sine';
      osc1.frequency.setValueAtTime(146.83, now); // D3
      gain1.gain.setValueAtTime(0.0, now);
      gain1.gain.linearRampToValueAtTime(1.3, now + 0.04);
      gain1.gain.exponentialRampToValueAtTime(0.0001, now + 6.0);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(now);
      osc1.stop(now + 6.0);

      // 美しい倍音（重厚感と広がり）
      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = 'sine';
      osc2.frequency.setValueAtTime(293.66, now); // D4
      gain2.gain.setValueAtTime(0.0, now);
      gain2.gain.linearRampToValueAtTime(0.5, now + 0.03);
      gain2.gain.exponentialRampToValueAtTime(0.0001, now + 5.0);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(now);
      osc2.stop(now + 5.0);

    } catch(e) {
      console.log('Audio Play Error:', e);
    }
  }

  // ステップ切り替え用（1回）
  function playSingleGong() {
    playGongSound();
  }

  // 終了時フィナーレ用（3回連続）
  function playTripleGong() {
    playGongSound();
    setTimeout(() => playGongSound(), 1600);
    setTimeout(() => playGongSound(), 3200);
  }

  const courses = {
    9: [
      { name: "第6チャクラ", duration: 60,  minText: "1分" },
      { name: "第7チャクラ", duration: 60,  minText: "1分" },
      { name: "第1チャクラ", duration: 180, minText: "3分" },
      { name: "ステージ",     duration: 180, minText: "3分" },
      { name: "軟酥",         duration: 60,  minText: "1分" }
    ],
    21: [
      { name: "第6チャクラ", duration: 180, minText: "3分" },
      { name: "第7チャクラ", duration: 180, minText: "3分" },
      { name: "第1チャクラ", duration: 360, minText: "6分" },
      { name: "ステージ",     duration: 360, minText: "6分" },
      { name: "軟酥",         duration: 180, minText: "3分" }
    ]
  };

  let currentCourseMinutes = 9;
  let currentStepIdx = 0;
  let stepSecondsLeft = 0;
  let timerId = null;
  let isRunning = false;
  let startTimeStr = '';
  let isFinished = false;
  let todayTotalMinutes = 0;
  let todayDateKey = '';
  let targetEndTime = null;

  function init() {
    const now = new Date();
    const hour = now.getHours();
    
    let timeOfDay = '昼';
    if (hour >= 4 && hour < 11) {
      timeOfDay = '朝';
    } else if (hour >= 11 && hour < 16) {
      timeOfDay = '昼';
    } else if (hour >= 16 && hour < 19) {
      timeOfDay = '夕';
    } else {
      timeOfDay = '夜';
    }

    const dateStr = now.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' });
    document.getElementById('currentDate').innerText = `${dateStr} ${timeOfDay}`;
    
    todayDateKey = now.toDateString();
    const savedDate = localStorage.getItem('meditation_date');
    const savedTotal = localStorage.getItem('meditation_total');
    
    if (savedDate === todayDateKey && savedTotal) {
      todayTotalMinutes = parseInt(savedTotal, 10);
    } else {
      todayTotalMinutes = 0;
      localStorage.setItem('meditation_date', todayDateKey);
      localStorage.setItem('meditation_total', 0);
    }
    
    updateTodaySumDisplay();
    selectCourse(9);
  }

  function updateTodaySumDisplay() {
    document.getElementById('todaySumDisplay').innerText = `本日の合計：${todayTotalMinutes}分`;
  }

  function getFormattedTime() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2, '0');
    const m = now.getMinutes().toString().padStart(2, '0');
    return `${h}:${m}`;
  }

  function selectCourse(mins) {
    if (isRunning) resetTimer();
    currentCourseMinutes = mins;
    document.querySelectorAll('.btn-course').forEach(btn => {
      btn.classList.toggle('active', btn.innerText.includes(mins + '分'));
    });
    currentStepIdx = 0;
    isFinished = false;
    loadStep(0);
    renderStepsList();
  }

  function renderStepsList() {
    const container = document.getElementById('stepsListContainer');
    const steps = courses[currentCourseMinutes];
    container.innerHTML = '';
    
    steps.forEach((step, idx) => {
      const row = document.createElement('div');
      row.className = 'step-item' + (idx === currentStepIdx && !isFinished ? ' active-row' : '');
      row.innerHTML = `
        <div class="step-left">
          <div class="step-badge">${idx + 1}</div>
          <span>${step.name}</span>
        </div>
        <span class="step-time-text">${step.minText}</span>
      `;
      container.appendChild(row);
    });
  }

  function loadStep(idx) {
    const steps = courses[currentCourseMinutes];
    if (idx >= steps.length) return;
    currentStepIdx = idx;
    stepSecondsLeft = steps[idx].duration;
    document.getElementById('stepName').innerText = steps[idx].name;
    const timeElem = document.getElementById('timeDisplay');
    timeElem.classList.remove('completed-display');
    updateDisplay();
    renderStepsList();
  }

  function updateDisplay() {
    if (isFinished) return;
    const m = Math.floor(stepSecondsLeft / 60).toString().padStart(2, '0');
    const s = (stepSecondsLeft % 60).toString().padStart(2, '0');
    document.getElementById('timeDisplay').innerText = `${m}:${s}`;
  }

  function toggleTimer() {
    getAudioContext();

    if (isRunning) {
      clearInterval(timerId);
      isRunning = false;
      targetEndTime = null;
      document.getElementById('startBtn').innerText = 'スタート';
    } else {
      if (isFinished) {
        resetTimer();
      }

      if (!startTimeStr) {
        startTimeStr = getFormattedTime();
        document.getElementById('timeLog').innerText = `開始：${startTimeStr}`;
      }
      
      isRunning = true;
      targetEndTime = Date.now() + (stepSecondsLeft * 1000);
      document.getElementById('startBtn').innerText = '一時停止';
      timerId = setInterval(tick, 200);
    }
  }

  function tick() {
    if (!isRunning) return;

    const now = Date.now();
    const remainingMs = targetEndTime - now;
    stepSecondsLeft = Math.max(0, Math.ceil(remainingMs / 1000));
    
    updateDisplay();

    if (stepSecondsLeft <= 0) {
      const steps = courses[currentCourseMinutes];
      
      if (currentStepIdx < steps.length - 1) {
        playSingleGong(); // 切り替えの1回ゴング
        
        currentStepIdx++;
        stepSecondsLeft = steps[currentStepIdx].duration;
        targetEndTime = Date.now() + (stepSecondsLeft * 1000);
        document.getElementById('stepName').innerText = steps[currentStepIdx].name;
        updateDisplay();
        renderStepsList();
      } else {
        // 最後のステップ「軟酥」が終わったとき
        playTripleGong(); // フィナーレの3回ゴング

        clearInterval(timerId);
        isRunning = false;
        targetEndTime = null;
        isFinished = true;
        
        const endTimeStr = getFormattedTime();
        document.getElementById('timeLog').innerText = `開始：${startTimeStr} 〜 終了：${endTimeStr}`;
        
        todayTotalMinutes += currentCourseMinutes;
        localStorage.setItem('meditation_total', todayTotalMinutes);
        updateTodaySumDisplay();
        
        const timeElem = document.getElementById('timeDisplay');
        timeElem.innerText = `${currentCourseMinutes}分完了`;
        timeElem.classList.add('completed-display');
        
        document.getElementById('stepName').innerText = '完了コース';
        document.getElementById('startBtn').innerText = 'スタート';
        renderStepsList();
      }
    }
  }

  function resetTimer() {
    clearInterval(timerId);
    isRunning = false;
    targetEndTime = null;
    isFinished = false;
    startTimeStr = '';
    document.getElementById('timeLog').innerText = '';
    document.getElementById('startBtn').innerText = 'スタート';
    loadStep(0);
  }

  // 画面が閉じられてから復帰したときの処理
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && isRunning && targetEndTime) {
      getAudioContext(); // 復帰時にオーディオを再有効化
      const now = Date.now();
      const remainingMs = targetEndTime - now;
      if (remainingMs <= 0) {
        tick();
      } else {
        stepSecondsLeft = Math.ceil(remainingMs / 1000);
        updateDisplay();
      }
    }
  });

  document.addEventListener('touchstart', () => getAudioContext(), { passive: true });
  document.addEventListener('click', () => getAudioContext(), { passive: true });

  window.onload = init;
</script>
</body>
</html>
