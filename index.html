<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瞑想アプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      text-align: center;
    }
    .date-bar {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.5rem; color: #2d3748; margin-bottom: 20px; }
    .course-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-course {
      flex: 1;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      background: #fff;
      color: #4a5568;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-course.active {
      background: #3182ce;
      color: #fff;
      border-color: #3182ce;
    }
    .step-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #3182ce;
      margin-bottom: 10px;
    }
    .timer-display {
      font-size: 3.5rem;
      font-weight: bold;
      color: #2d3748;
      margin: 15px 0 25px;
      font-variant-numeric: tabular-nums;
    }
    .control-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    .btn-action {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-start { background: #eab308; color: #fff; }
    .btn-reset { background: #f87171; color: #fff; }
  </style>
</head>
<body>

<div class="card">
  <div class="date-bar" id="currentDate"></div>

  <h1>瞑想アプリ</h1>

  <div class="course-selector">
    <button class="btn-course active" onclick="selectCourse(9)">9分コース</button>
    <button class="btn-course" onclick="selectCourse(21)">21分コース</button>
  </div>

  <div class="step-title" id="stepName">ステップ: 第6チャクラ</div>
  <div class="timer-display" id="timeDisplay">01:00</div>

  <div class="control-btns">
    <button class="btn-action btn-start" id="startBtn" onclick="toggleTimer()">スタート</button>
    <button class="btn-action btn-reset" onclick="resetTimer()">リセット</button>
  </div>
</div>

<script>
  // Web Audio API による低音シンキングボウル風ゴング音生成
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSingingBowl() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    // シンキングボウルらしい低めの周波数（146.8 Hz / D3付近）
    osc.type = 'sine';
    osc.frequency.setValueAtTime(146.83, audioCtx.currentTime);
    
    // 余韻をしっかり持たせる
    gain.gain.setValueAtTime(0.0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);
    
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 4.5);
  }

  // ステップ切り替え時：ゴング1回
  function playSingleGong() {
    playSingingBowl();
  }

  // 終了時：ゴング3連打
  function playTripleGong() {
    playSingingBowl();
    setTimeout(playSingingBowl, 1500);
    setTimeout(playSingingBowl, 3000);
  }

  // ご指定の正確なコース構成
  const courses = {
    9: [
      { name: "第6チャクラ", duration: 60 },   // 1分
      { name: "第7チャクラ", duration: 60 },   // 1分
      { name: "第1チャクラ", duration: 180 },  // 3分
      { name: "ステージ",     duration: 180 },  // 3分
      { name: "軟酥",         duration: 60 }    // 1分
    ],
    21: [
      { name: "第6チャクラ", duration: 180 },  // 3分
      { name: "第7チャクラ", duration: 180 },  // 3分
      { name: "第1チャクラ", duration: 360 },  // 6分
      { name: "ステージ",     duration: 360 },  // 6分
      { name: "軟酥",         duration: 180 }   // 3分
    ]
  };

  let currentCourseMinutes = 9;
  let currentStepIdx = 0;
  let stepSecondsLeft = 0;
  let timerId = null;
  let isRunning = false;

  function init() {
    const now = new Date();
    document.getElementById('currentDate').innerText = now.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
    selectCourse(9);
  }

  function selectCourse(mins) {
    if (isRunning) resetTimer();
    currentCourseMinutes = mins;
    document.querySelectorAll('.btn-course').forEach(btn => {
      btn.classList.toggle('active', btn.innerText.includes(mins + '分'));
    });
    currentStepIdx = 0;
    loadStep(0);
  }

  function loadStep(idx) {
    const steps = courses[currentCourseMinutes];
    if (idx >= steps.length) return;
    currentStepIdx = idx;
    stepSecondsLeft = steps[idx].duration;
    document.getElementById('stepName').innerText = "ステップ: " + steps[idx].name;
    updateDisplay();
  }

  function updateDisplay() {
    const m = Math.floor(stepSecondsLeft / 60).toString().padStart(2, '0');
    const s = (stepSecondsLeft % 60).toString().padStart(2, '0');
    document.getElementById('timeDisplay').innerText = `${m}:${s}`;
  }

  function toggleTimer() {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    if (isRunning) {
      clearInterval(timerId);
      isRunning = false;
      document.getElementById('startBtn').innerText = 'スタート';
    } else {
      isRunning = true;
      document.getElementById('startBtn').innerText = '一時停止';
      timerId = setInterval(tick, 1000);
    }
  }

  function tick() {
    if (stepSecondsLeft > 0) {
      stepSecondsLeft--;
      updateDisplay();
    } else {
      const steps = courses[currentCourseMinutes];
      if (currentStepIdx < steps.length - 1) {
        // 次のステップへ切り替え（ゴング1回）
        playSingleGong();
        loadStep(currentStepIdx + 1);
      } else {
        // 全ステップ完了（ゴング3連打）
        clearInterval(timerId);
        isRunning = false;
        playTripleGong();
        document.getElementById('startBtn').innerText = 'スタート';
        alert('瞑想が完了しました');
      }
    }
  }

  function resetTimer() {
    clearInterval(timerId);
    isRunning = false;
    document.getElementById('startBtn').innerText = 'スタート';
    loadStep(0);
  }

  window.onload = init;
</script>
</body>
</html>
