<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瞑想の記録</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #121212 0%, #2b0b0e 50%, #1a1a1a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #f4efe6;
      color: #2d3748;
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
      border: 1px solid rgba(214, 158, 46, 0.3);
      position: relative;
    }
    .record-title {
      font-size: 0.95rem;
      color: #718096;
      letter-spacing: 1px;
      margin-bottom: 4px;
      border-bottom: 1px solid #e2dcd0;
      padding-bottom: 10px;
    }
    
    .date-info {
      font-size: 1.5rem !important;
      color: #1a202c !important;
      margin: 8px 0 4px 0;
      font-weight: 800 !important;
    }

    .session-time-log {
      font-size: 1.3rem;
      color: #e53e3e;
      font-weight: 900;
      margin-top: 4px;
      min-height: 1.5em;
      letter-spacing: 0.5px;
    }

    .timer-container {
      position: relative;
      display: inline-block;
      width: 100%;
      margin: 10px 0 20px 0;
    }

    .fujiko-img {
      position: absolute;
      top: 35px;
      right: -15px;
      width: 70px;
      height: auto;
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    .total-time {
      font-size: 3.2rem;
      font-weight: bold;
      color: #1a202c;
      margin: 0;
      letter-spacing: -1px;
    }
    .completed-display {
      font-size: 2.6rem;
      font-weight: 900;
      color: #dd6b20;
    }

    .course-title-sub {
      font-size: 1.05rem;
      color: #2d3748;
      font-weight: bold;
      margin-bottom: 6px;
    }
    
    .today-sum {
      font-size: 1.25rem;
      color: #9c4221;
      font-weight: 900;
      margin-bottom: 20px;
      min-height: 1.4em;
      letter-spacing: 0.5px;
    }

    .course-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }
    .btn-course {
      flex: 1;
      padding: 10px;
      border: 2px solid #d4c5b9;
      border-radius: 12px;
      background: #fff;
      color: #4a5568;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-course.active {
      background: #dd6b20;
      color: #fff;
      border-color: #dd6b20;
    }

    .control-btns {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      justify-content: center;
    }
    .btn-action {
      padding: 8px 24px !important;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 0.9rem !important;
      cursor: pointer;
      flex: 0 1 auto !important;
      min-width: 110px;
    }
    .btn-start { background: #d69e2e; color: #fff; }
    .btn-reset { background: #e53e3e; color: #fff; }

    .steps-list {
      text-align: left;
      border-top: 1px solid #e2dcd0;
      padding-top: 16px;
    }
    .step-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 8px;
      border-bottom: 1px solid #eae5dc;
      font-size: 1rem;
      color: #2d3748;
    }
    .step-item.active-row {
      background: #eae3d5;
      border-radius: 10px;
      font-weight: bold;
      color: #9c4221;
    }
    .step-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .step-badge {
      background: #dd6b20;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .step-time-text {
      font-weight: bold;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="record-title">瞑想の記録</div>
  <div class="date-info" id="currentDate"></div>
  <div class="session-time-log" id="timeLog"></div>

  <div class="timer-container">
    <div class="total-time" id="timeDisplay">01:00</div>
    <img src="不二子.png" class="fujiko-img" alt="峰不二子">
  </div>

  <div class="course-title-sub" id="stepName">第6チャクラ</div>
  <div class="today-sum" id="todaySumDisplay">本日の合計：0分</div>

  <div class="course-selector">
    <button class="btn-course active" onclick="selectCourse(9)">9分コース</button>
    <button class="btn-course" onclick="selectCourse(21)">21分コース</button>
  </div>

  <div class="control-btns">
    <button class="btn-action btn-start" id="startBtn" onclick="toggleTimer()">スタート</button>
    <button class="btn-action btn-reset" onclick="resetTimer()">リセット</button>
  </div>

  <div class="steps-list" id="stepsListContainer"></div>
</div>

<script>

    const view = new DataView(buffer);

      for (let i = 0; i < string.length; i++) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }

    view.setUint32(4, 36 + numSamples * 2, true);
    writeString(8, 'WAVE');
    writeString(12, 'fmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, 1, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    writeString(36, 'data');
    view.setUint32(40, numSamples * 2, true);

      const env2 = Math.exp(-t * 1.4);
