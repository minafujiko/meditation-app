<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>瞑想の記録</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #121212 0%, #2b0b0e 50%, #1a1a1a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #f4efe6;
      color: #2d3748;
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      text-align: center;
      border: 1px solid rgba(214, 158, 46, 0.3);
      position: relative;
    }
    .record-title {
      font-size: 0.95rem;
      color: #718096;
      letter-spacing: 1px;
      margin-bottom: 6px;
      border-bottom: 1px solid #e2dcd0;
      padding-bottom: 12px;
    }
    .date-info {
      font-size: 1rem;
      color: #4a5568;
      margin-top: 10px;
      font-weight: 500;
    }
    /* ③ 何時から何時の表示を大きく・赤色に改善 */
    .session-time-log {
      font-size: 1.3rem;
      color: #e53e3e;
      font-weight: 900;
      margin-top: 8px;
      min-height: 1.5em;
      letter-spacing: 0.5px;
    }

    .timer-container {
      position: relative;
      display: inline-block;
      width: 100%;
      margin: 10px 0 20px 0;
    }

    .fujiko-img {
      position: absolute;
      top: 35px;
      right: -15px;
      width: 70px;
      height: auto;
      z-index: 10;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
    }

    /* ② 終わったあともタイマー部分に大きく表示を維持するスタイル */
    .total-time {
      font-size: 3.2rem;
      font-weight: bold;
      color: #1a202c;
      margin: 0;
      letter-spacing: -1px;
    }
    .completed-display {
      font-size: 2.6rem;
      font-weight: 900;
      color: #dd6b20;
    }

    .course-title-sub {
      font-size: 1.05rem;
      color: #2d3748;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .today-sum {
      font-size: 0.9rem;
      color: #718096;
      margin-bottom: 24px;
    }

    .course-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-course {
      flex: 1;
      padding: 10px;
      border: 2px solid #d4c5b9;
      border-radius: 12px;
      background: #fff;
      color: #4a5568;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-course.active {
      background: #dd6b20;
      color: #fff;
      border-color: #dd6b20;
    }

    .control-btns {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    .btn-action {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-start { background: #d69e2e; color: #fff; }
    .btn-reset { background: #e53e3e; color: #fff; }

    .steps-list {
      text-align: left;
      border-top: 1px solid #e2dcd0;
      padding-top: 16px;
    }
    .step-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 8px;
      border-bottom: 1px solid #eae5dc;
      font-size: 1rem;
      color: #2d3748;
    }
    .step-item.active-row {
      background: #eae3d5;
      border-radius: 10px;
      font-weight: bold;
      color: #9c4221;
    }
    .step-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .step-badge {
      background: #dd6b20;
      color: #fff;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .step-time-text {
      font-weight: bold;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="record-title">瞑想の記録</div>
  <div class="date-info" id="currentDate"></div>
  <div class="session-time-log" id="timeLog"></div>

  <div class="timer-container">
    <div class="total-time" id="timeDisplay">01:00</div>
    <img src="不二子.png" class="fujiko-img" alt="峰不二子">
  </div>

  <div class="course-title-sub" id="stepName">第6チャクラ</div>
  <div class="today-sum" id="statusMessage">スタートボタンを押してください</div>

  <div class="course-selector">
    <button class="btn-course active" onclick="selectCourse(9)">9分コース</button>
    <button class="btn-course" onclick="selectCourse(21)">21分コース</button>
  </div>

  <div class="control-btns">
    <button class="btn-action btn-start" id="startBtn" onclick="toggleTimer()">スタート</button>
    <button class="btn-action btn-reset" onclick="resetTimer()">リセット</button>
  </div>

  <div class="steps-list" id="stepsListContainer"></div>
</div>

<script>
  let audioCtx = null;

  // ① 音声が確実に鳴るための強力な初期化・再開処理
  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playSingingBowl() {
    initAudio();
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'sine';
      osc.frequency.setValueAtTime(146.83, audioCtx.currentTime);
      
      gain.gain.setValueAtTime(0.0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.8, audioCtx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 4.5);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 4.5);
    } catch(e) {
      console.log('Audio error:', e);
    }
  }

  function playSingleGong() { playSingingBowl(); }
  function playTripleGong() {
    playSingingBowl();
    setTimeout(playSingingBowl, 1500);
    setTimeout(playSingingBowl, 3000);
  }

  const courses = {
    9: [
      { name: "第6チャクラ", duration: 60, minText: "1分" },
      { name: "第7チャクラ", duration: 60, minText: "1分" },
      { name: "第1チャクラ", duration: 180, minText: "3分" },
      { name: "ステージ",     duration: 180, minText: "3分" },
      { name: "軟酥",         duration: 60, minText: "1分" }
    ],
    21: [
      { name: "第6チャクラ", duration: 180, minText: "3分" },
      { name: "第7チャクラ", duration: 180, minText: "3分" },
      { name: "第1チャクラ", duration: 360, minText: "6分" },
      { name: "ステージ",     duration: 360, minText: "6分" },
      { name: "軟酥",         duration: 180, minText: "3分" }
    ]
  };

  let currentCourseMinutes = 9;
  let currentStepIdx = 0;
  let stepSecondsLeft = 0;
  let timerId = null;
  let isRunning = false;
  let startTimeStr = '';
  let isFinished = false; // 完了状態を保持するフラグ

  function init() {
    const now = new Date();
    const hour = now.getHours();
    
    let timeOfDay = '昼';
    if (hour >= 4 && hour < 11) {
      timeOfDay = '朝';
    } else if (hour >= 11 && hour < 16) {
      timeOfDay = '昼';
    } else if (hour >= 16 && hour < 19) {
      timeOfDay = '夕';
    } else {
      timeOfDay = '夜';
    }

    const dateStr = now.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'short' });
    document.getElementById('currentDate').innerText = `${dateStr} ${timeOfDay}`;
    selectCourse(9);
  }

  function getFormattedTime() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2, '0');
    const m = now.getMinutes().toString().padStart(2, '0');
    return `${h}:${m}`;
  }

  function selectCourse(mins) {
    if (isRunning) resetTimer();
    currentCourseMinutes = mins;
    document.querySelectorAll('.btn-course').forEach(btn => {
      btn.classList.toggle('active', btn.innerText.includes(mins + '分'));
    });
    currentStepIdx = 0;
    isFinished = false;
    loadStep(0);
    renderStepsList();
  }

  function renderStepsList() {
    const container = document.getElementById('stepsListContainer');
    const steps = courses[currentCourseMinutes];
    container.innerHTML = '';
    
    steps.forEach((step, idx) => {
      const row = document.createElement('div');
      row.className = 'step-item' + (idx === currentStepIdx && !isFinished ? ' active-row' : '');
      row.innerHTML = `
        <div class="step-left">
          <div class="step-badge">${idx + 1}</div>
          <span>${step.name}</span>
        </div>
        <span class="step-time-text">${step.minText}</span>
      `;
      container.appendChild(row);
    });
  }

  function loadStep(idx) {
    const steps = courses[currentCourseMinutes];
    if (idx >= steps.length) return;
    currentStepIdx = idx;
    stepSecondsLeft = steps[idx].duration;
    document.getElementById('stepName').innerText = steps[idx].name;
    const timeElem = document.getElementById('timeDisplay');
    timeElem.classList.remove('completed-display');
    updateDisplay();
    renderStepsList();
  }

  function updateDisplay() {
    if (isFinished) return; // 完了時はタイマー数値を上書きしない
    const m = Math.floor(stepSecondsLeft / 60).toString().padStart(2, '0');
    const s = (stepSecondsLeft % 60).toString().padStart(2, '0');
    document.getElementById('timeDisplay').innerText = `${m}:${s}`;
  }

  function toggleTimer() {
    initAudio();
    
    if (isRunning) {
      clearInterval(timerId);
      isRunning = false;
      document.getElementById('startBtn').innerText = 'スタート';
      document.getElementById('statusMessage').innerText = '一時停止中';
    } else {
      // もし既に完了していたら、スタートボタンで新規にやり直せるようにリセットする
      if (isFinished) {
        resetTimer();
      }

      if (!startTimeStr) {
        startTimeStr = getFormattedTime();
        document.getElementById('timeLog').innerText = `開始：${startTimeStr}`;
      }
      
      isRunning = true;
      document.getElementById('startBtn').innerText = '一時停止';
      document.getElementById('statusMessage').innerText = '瞑想中...';
      timerId = setInterval(tick, 1000);
    }
  }

  function tick() {
    if (stepSecondsLeft > 0) {
      stepSecondsLeft--;
      updateDisplay();
    } else {
      const steps = courses[currentCourseMinutes];
      if (currentStepIdx < steps.length - 1) {
        playSingleGong();
        loadStep(currentStepIdx + 1);
      } else {
        // 全ステップ完了処理
        clearInterval(timerId);
        isRunning = false;
        isFinished = true; // 完了フラグを立てる
        playTripleGong();
        
        const endTimeStr = getFormattedTime();
        // ③ 時間ログを大きく赤色で表示
        document.getElementById('timeLog').innerText = `開始：${startTimeStr} 〜 終了：${endTimeStr}`;
        
        // ② 終わったあともゼロにせず、完了した時間を大きく表示し続ける
        const timeElem = document.getElementById('timeDisplay');
        timeElem.innerText = `${currentCourseMinutes}分完了`;
        timeElem.classList.add('completed-display');
        
        document.getElementById('stepName').innerText = '全工程 完了';
        document.getElementById('startBtn').innerText = 'スタート';
        document.getElementById('statusMessage').innerText = 'お疲れ様でした！素晴らしい瞑想でした。';
        renderStepsList();
      }
    }
  }

  function resetTimer() {
    clearInterval(timerId);
    isRunning = false;
    isFinished = false;
    startTimeStr = '';
    document.getElementById('timeLog').innerText = '';
    document.getElementById('startBtn').innerText = 'スタート';
    document.getElementById('statusMessage').innerText = 'スタートボタンを押してください';
    loadStep(0);
  }

  // 画面タップ・タッチ時に音声制限を確実に解除
  document.addEventListener('touchstart', initAudio, { passive: true });
  document.addEventListener('click', initAudio, { passive: true });

  window.onload = init;
</script>
</body>
</html>
